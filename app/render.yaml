services:
  - type: web
    name: qlcv-cbtd
    runtime: static
    buildCommand: node tools/build.js demo && node tools/build.js config
    staticPublishPath: frontend
    envVars:
      - key: API_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: DEMO_MODE
        value: "false"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
